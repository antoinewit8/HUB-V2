<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Itinéraires et Werbomont</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Inter", "Helvetica Neue", Arial, sans-serif;
  --text: #1d1d1f; --sub: #6e6e73; --hair: #e5e5ea; --soft: #f2f2f7; --navy: #003087;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: var(--font); color: var(--text); background: #1d1d1f; -webkit-font-smoothing: antialiased; }
#map { position: absolute; inset: 0; }
#panel { position: absolute; top: 12px; left: 12px; bottom: 12px; width: 390px; z-index: 1000; display: flex; flex-direction: column;
  background: rgba(255,255,255,.88); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,.25), 0 0 0 .5px rgba(0,0,0,.08); overflow: hidden; }
header { padding: 18px 18px 10px; }
h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin: 0; }
.meta { font-size: 12px; color: var(--sub); margin-top: 3px; line-height: 1.4; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.chip { border: none; border-radius: 980px; padding: 5px 11px; font: 500 12px var(--font); cursor: pointer; background: var(--soft); color: var(--sub); }
.chip i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.chip.on { color: var(--text); background: #fff; box-shadow: 0 0 0 1px var(--hair); }
.row { display: flex; gap: 8px; margin-top: 10px; }
input, select { font: 14px var(--font); border: none; background: rgba(118,118,128,.12); border-radius: 10px; padding: 8px 10px; color: var(--text); outline: none; }
input { flex: 1; min-width: 0; } select { width: 140px; }
#list { flex: 1; overflow: auto; padding: 4px 10px 12px; border-top: .5px solid var(--hair); }
.it { padding: 10px; border-radius: 12px; cursor: pointer; display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: center; }
.it:hover { background: rgba(0,0,0,.04); } .it.sel { background: rgba(10,132,255,.12); }
.it .dot { width: 10px; height: 10px; border-radius: 50%; }
.it .t { font-size: 14px; font-weight: 500; line-height: 1.3; }
.it .s { font-size: 12px; color: var(--sub); margin-top: 1px; }
.it .k { text-align: right; font-size: 14px; font-weight: 600; white-space: nowrap; }
.it .k small { display: block; font-size: 11px; font-weight: 400; color: var(--sub); }
.empty { color: var(--sub); font-size: 14px; padding: 20px 10px; }
#card { display: none; border-top: .5px solid var(--hair); padding: 14px 18px 16px; background: rgba(255,255,255,.75); max-height: 52%; overflow: auto; }
#card h2 { font-size: 16px; font-weight: 600; margin: 0 0 4px; letter-spacing: -0.01em; line-height: 1.3; }
#card .cli { font-size: 12px; color: var(--sub); margin-bottom: 10px; }
.grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.cell { background: #fff; border-radius: 12px; padding: 8px 10px; box-shadow: 0 0 0 .5px rgba(0,0,0,.06); }
.cell .v { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; } .cell .l { font-size: 11px; color: var(--sub); }
.cmp { margin-top: 10px; font-size: 13px; line-height: 1.5; }
.badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 2px 8px; border-radius: 980px; color: #fff; margin: 2px 0 4px; }
.x { float: right; border: none; background: var(--soft); border-radius: 50%; width: 24px; height: 24px; cursor: pointer; color: var(--sub); font-size: 14px; line-height: 24px; padding: 0; margin-left: 8px; }
#fonds { position: absolute; top: 12px; right: 12px; z-index: 1000; display: flex; background: rgba(255,255,255,.88); backdrop-filter: blur(20px);
  border-radius: 10px; padding: 2px; box-shadow: 0 4px 18px rgba(0,0,0,.2); }
#fonds button { border: none; background: transparent; font: 500 13px var(--font); padding: 6px 12px; border-radius: 8px; cursor: pointer; color: var(--text); }
#fonds button.on { background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.15); }
#leg { position: absolute; bottom: 24px; right: 60px; z-index: 1000; background: rgba(255,255,255,.88); backdrop-filter: blur(20px);
  border-radius: 12px; padding: 8px 12px; font-size: 12px; color: var(--sub); box-shadow: 0 4px 18px rgba(0,0,0,.2); line-height: 1.7; }
#leg i { display: inline-block; width: 18px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: 3px; }
.leaflet-bar { border: none !important; border-radius: 12px !important; overflow: hidden; box-shadow: 0 4px 18px rgba(0,0,0,.25) !important; }
.leaflet-bar a { background: rgba(255,255,255,.9) !important; color: var(--text) !important; width: 36px !important; height: 36px !important; line-height: 36px !important; }
.leaflet-tooltip { border-radius: 8px; border: none; box-shadow: 0 4px 14px rgba(0,0,0,.18); font: 500 12px var(--font); }
.wpin { width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%; background: var(--navy); color: #fff; font: 700 15px var(--font);
  display: flex; align-items: center; justify-content: center; border: 3px solid #fff; box-shadow: 0 3px 12px rgba(0,0,0,.45); }
.pt { width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 6px rgba(0,0,0,.5);
  color: #fff; font: 700 11px var(--font); display: flex; align-items: center; justify-content: center; }
@media (max-width: 700px) { #panel { width: auto; right: 12px; top: auto; height: 55%; } #leg { display: none; } }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <header>
    <h1>Itinéraires et Werbomont</h1>
    <div class="meta" id="meta"></div>
    <div class="chips" id="chips"></div>
    <div class="row"><input id="q" placeholder="Ville, client…"><select id="tri">
      <option value="n">Nb dossiers</option><option value="det">Détour</option><option value="ca">CA</option><option value="dw">Distance à W</option></select></div>
  </header>
  <div id="list"></div>
  <div id="card"></div>
</div>
<div id="fonds"></div>
<div id="leg"></div>
<script>
const D = __DATA__;
const BORDERS = __BORDERS__;
const CAT = D.cat;                       // {cle: [libellé, couleur]}
const W = D.w, S = D.seuils;
const state = { cats: { passe: true, ok: true, verif: true, lourd: false, na: false }, q: '', tri: 'n', sel: null, fond: 'Satellite' };
const $ = id => document.getElementById(id);
const esc = v => v == null ? '' : String(v).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const nf = (v, d = 0) => v == null ? '—' : v.toLocaleString('fr-FR', { minimumFractionDigits: d, maximumFractionDigits: d });

// Fonds : les mêmes que la carte des lavages
function esri(s) { return `https://server.arcgisonline.com/ArcGIS/rest/services/${s}/MapServer/tile/{z}/{y}/{x}`; }
const FONDS = {
  'Satellite': { layers: [[esri('World_Imagery'), 'Tiles © Esri', 18], [esri('Reference/World_Boundaries_and_Places'), '© Esri', 18]], front: '#ffd54f', halo: '#000000' },
  'Sombre': { layers: [[esri('Canvas/World_Dark_Gray_Base'), 'Tiles © Esri', 16], [esri('Canvas/World_Dark_Gray_Reference'), '© Esri', 16]], front: '#ffd54f', halo: '#000000' },
};
const map = L.map('map', { zoomControl: false, preferCanvas: true }).setView([49.8, 5.2], 6);
L.control.zoom({ position: 'bottomright' }).addTo(map);
L.control.scale({ position: 'bottomleft', imperial: false }).addTo(map);
let tiles = [], bHalo = null, bLine = null;
function setFond(f) {
  state.fond = f; tiles.forEach(t => map.removeLayer(t));
  tiles = FONDS[f].layers.map(([u, a, z], i) => L.tileLayer(u, { attribution: a, maxNativeZoom: z, maxZoom: 19, zIndex: i }).addTo(map));
  [bHalo, bLine].forEach(l => l && map.removeLayer(l)); bHalo = bLine = null;
  if (BORDERS) {
    bHalo = L.geoJSON(BORDERS, { interactive: false, style: { color: FONDS[f].halo, weight: 7, opacity: .75 } }).addTo(map);
    bLine = L.geoJSON(BORDERS, { interactive: false, style: { color: FONDS[f].front, weight: 2.6, opacity: 1 } }).addTo(map);
    bHalo.bringToBack(); bLine.bringToBack();
  }
  document.querySelectorAll('#fonds button').forEach(b => b.classList.toggle('on', b.dataset.f === f));
}
$('fonds').innerHTML = Object.keys(FONDS).map(f => `<button data-f="${f}">${f}</button>`).join('');
$('fonds').onclick = e => { if (e.target.dataset.f) setFond(e.target.dataset.f); };
setFond('Satellite');

L.circle(W, { radius: D.couloir * 1000, color: '#0a84ff', weight: 1.5, opacity: .9, fillOpacity: .12, interactive: false }).addTo(map);
L.marker(W, { icon: L.divIcon({ className: '', html: '<div class="wpin">W</div>', iconSize: [0, 0] }), zIndexOffset: 2000 })
  .bindTooltip(`CB Groupe · 4190 Werbomont<br><span style="color:#6e6e73">Cercle : itinéraire à moins de ${D.couloir} km = passe par Werbomont</span>`, { direction: 'top', offset: [0, -18] }).addTo(map);

const lyr = L.layerGroup().addTo(map), sel = L.layerGroup().addTo(map);
D.lignes.forEach((l, i) => l.i = i);
function poids(n) { return 2 + Math.log2(1 + n) * .8; }

function visibles() {
  const q = state.q.trim().toUpperCase();
  const a = D.lignes.filter(l => state.cats[l.cat] && (!q || (l.l + ' ' + (l.cli || '')).toUpperCase().includes(q)));
  const k = { n: l => -l.n, ca: l => -(l.ca || 0), det: l => l.det ?? 1e9, dw: l => l.dw ?? 1e9 }[state.tri];
  return a.sort((x, y) => k(x) - k(y));
}
function trace(l) { return l.tr && l.tr.length > 1 ? l.tr : l.pts; }

function dessiner() {
  lyr.clearLayers();
  const v = visibles();
  v.slice().reverse().forEach(l => {
    const c = CAT[l.cat][1], estime = !(l.tr && l.tr.length > 1);
    L.polyline(trace(l), { color: c, weight: poids(l.n), opacity: state.sel == null || state.sel === l.i ? .85 : .2, dashArray: estime ? '4 8' : null })
      .bindTooltip(`<b>${esc(l.l)}</b><br>${l.n} dossiers · ${CAT[l.cat][0].toLowerCase()}${l.det ? ` · +${nf(l.det)} km` : ''}`, { sticky: true })
      .on('click', () => choisir(l.i, false)).addTo(lyr);
  });
  const cnt = {}; Object.keys(CAT).forEach(k => cnt[k] = 0); D.lignes.forEach(l => cnt[l.cat]++);
  $('chips').innerHTML = Object.keys(CAT).map(k =>
    `<button class="chip ${state.cats[k] ? 'on' : ''}" data-k="${k}"><i style="background:${CAT[k][1]}"></i>${CAT[k][0]} ${cnt[k]}</button>`).join('');
  $('list').innerHTML = v.length ? v.slice(0, 400).map(l => `<div class="it ${state.sel === l.i ? 'sel' : ''}" data-i="${l.i}">
      <span class="dot" style="background:${CAT[l.cat][1]}"></span>
      <div><div class="t">${esc(l.l)}</div><div class="s">${l.n} dossiers · ${nf(l.prix)} € moy. · ${l.km ? nf(l.km) + ' km' : 'km à calculer'}</div></div>
      <div class="k">${l.cat === 'passe' ? 'passe' : (l.det == null ? '—' : '+' + nf(l.det) + ' km')}<small>${l.dw == null ? '' : nf(l.dw) + ' km de W'}</small></div></div>`).join('')
    + (v.length > 400 ? `<div class="empty">${v.length - 400} lignes de plus : affinez la recherche.</div>` : '')
    : '<div class="empty">Aucune ligne pour ces filtres.</div>';
  $('leg').innerHTML = ['passe', 'ok', 'verif', 'lourd'].map(k => `<i style="background:${CAT[k][1]}"></i>${CAT[k][0]}`).join('<br>')
    + `<br><span style="font-size:11px">pointillés : pas encore d’itinéraire PTV</span>`;
}

function pin(p, txt, bg) { return L.marker(p, { icon: L.divIcon({ className: '', html: `<div class="pt" style="background:${bg}">${txt}</div>`, iconSize: [0, 0] }), zIndexOffset: 1500 }); }

function choisir(i, zoom = true) {
  state.sel = state.sel === i ? null : i;
  sel.clearLayers();
  if (state.sel == null) { $('card').style.display = 'none'; dessiner(); return; }
  const l = D.lignes[i], c = CAT[l.cat][1];
  if (l.trw && l.trw.length > 1) L.polyline(l.trw, { color: '#ffffff', weight: 4, dashArray: '8 8', opacity: .95 }).bindTooltip('Itinéraire via Werbomont').addTo(sel);
  L.polyline(trace(l), { color: c, weight: poids(l.n) + 2.5, opacity: 1 }).addTo(sel);
  l.pts.forEach((p, k) => pin(p, k === 0 ? 'C' : (k === l.pts.length - 1 ? 'D' : k), k === 0 ? '#248a3d' : '#d70015').addTo(sel));
  if (zoom) map.fitBounds(L.latLngBounds([...trace(l), W]), { paddingTopLeft: [430, 40], paddingBottomRight: [40, 40], maxZoom: 10 });
  const passe = l.cat === 'passe';
  $('card').style.display = 'block';
  $('card').innerHTML = `<button class="x" onclick="choisir(${i})">×</button>
    <h2>${esc(l.l)}</h2><span class="badge" style="background:${c}">${CAT[l.cat][0]}</span>
    <div class="cli">${esc(l.cli || '')}</div>
    <div class="grid">
      <div class="cell"><div class="v">${l.n}</div><div class="l">dossiers</div></div>
      <div class="cell"><div class="v">${nf(l.prix)} €</div><div class="l">prix moyen</div></div>
      <div class="cell"><div class="v">${nf(l.km)}</div><div class="l">km itinéraire</div></div>
      <div class="cell"><div class="v">${nf(l.dw)}</div><div class="l">km entre route et W</div></div>
      <div class="cell"><div class="v">${passe ? '0' : (l.det == null ? '—' : '+' + nf(l.det))}</div><div class="l">km de détour${l.src === 'estimé' ? ' (estimé)' : ''}</div></div>
      <div class="cell"><div class="v">${nf(l.kmw ?? (l.km && l.det != null ? l.km + l.det : null))}</div><div class="l">km via W</div></div>
    </div>
    <div class="cmp">${passe ? 'L’itinéraire PTV passe déjà par Werbomont.' :
      `Renta ${nf(l.rd, 2)} €/km → <b>${nf(l.rw, 2)} €/km</b> via Werbomont (${l.dp == null ? '—' : nf(l.dp, 1) + ' %'}).<br>Werbomont inséré entre ${esc(l.ins)}.`}
      ${l.deja ? `<br>${l.deja} dossiers ont déjà fait un relais à Werbomont.` : ''}
      ${!(l.tr && l.tr.length > 1) ? '<br><span style="color:#6e6e73">Itinéraire PTV pas encore calculé : trait en pointillés.</span>' : ''}</div>`;
  dessiner();
  const el = document.querySelector(`.it[data-i="${i}"]`); if (el) el.scrollIntoView({ block: 'nearest' });
}

$('meta').textContent = `${D.periode} · ${D.lignes.length} lignes · seuils ${S[0]} / ${S[1]} km · généré le ${D.genere}`;
$('chips').onclick = e => { const b = e.target.closest('.chip'); if (b) { state.cats[b.dataset.k] = !state.cats[b.dataset.k]; dessiner(); } };
$('list').onclick = e => { const it = e.target.closest('.it'); if (it) choisir(+it.dataset.i); };
$('q').oninput = e => { state.q = e.target.value; dessiner(); };
$('tri').onchange = e => { state.tri = e.target.value; dessiner(); };
dessiner();
</script>
</body>
</html>
